name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_PRODUCTION: '1'
      - run: python3 scripts/validate-deployment.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'services/analytics[test]'
      - run: python -m pytest -q services/analytics/tests
      - run: python scripts/check-analytics-package.py
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - run: python3 -m pip install --break-system-packages -e 'services/analytics[test]'
      - run: python3 scripts/test-database.py --then "python3 -m pytest -q services/analytics/tests/test_network_db.py"
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
