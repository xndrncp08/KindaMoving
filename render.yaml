# Configuration only; applying this Blueprint creates billable resources.
services:
  - type: web
    name: kindamoving-analytics
    runtime: python
    rootDir: services/analytics
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: pip install .
    startCommand: uvicorn km_analytics.api:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 2 --timeout-keep-alive 5
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 200
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: KM_DEPLOYMENT
        value: production
      - key: ANALYTICS_SERVICE_TOKEN
        sync: false
      - key: NETWORK_DATABASE_URL
        sync: false
