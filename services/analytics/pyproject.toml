[project]
name = "km-analytics"
version = "0.2.0"
description = "KindaMoving activity processing, analytics, routing and ghost alignment"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "garmin-fit-sdk==21.218.0",
  "defusedxml==0.7.1",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "hypothesis==6.170.14", "httpx"]
# Optional KM Form (video pose analysis). Also needs FORM_MODEL_PATH -> pose_landmarker_lite.task.
form = ["mediapipe==1.2.0", "opencv-python-headless==5.0.0"]

[tool.setuptools.packages.find]
include = ["km_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
